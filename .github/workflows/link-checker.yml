name: Link Checker

on:
  # Run weekly on Mondays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual triggering
  workflow_dispatch:

  # Run on push to main branch (optional - comment out if too frequent)
  # push:
  #   branches:
  #     - main

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/workflows/link-checker-config.json'
          folder-path: '.'
          file-extension: '.md'

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Broken links detected in documentation',
              body: `## Link Checker Report

              The automated link checker has detected broken links in the repository.

              **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

              ### Next Steps
              1. Review the workflow logs to identify broken links
              2. Update or remove broken links
              3. Consider if external links need to be archived or replaced
              4. Re-run the workflow to verify fixes

              ### Common Causes
              - External websites have moved or been removed
              - Internal links reference files that have been renamed or moved
              - Typos in URLs
              - Links to private or restricted resources

              ---

              _This issue was automatically created by the Link Checker workflow._`,
              labels: ['documentation', 'automated', 'links']
            });
            console.log('Created issue:', issue.data.number);
