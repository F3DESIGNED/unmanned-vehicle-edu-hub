name: Markdown Lint

on:
  # Run on pull requests that modify markdown files
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint.json'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --config .markdownlint.json --ignore node_modules --ignore .git
        continue-on-error: false

      - name: Comment on PR (if lint fails)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Markdown Linting Issues

            The markdown linting check has failed. Please review and fix the issues below.

            ### Common Issues
            - **Heading levels** - Don't skip heading levels (e.g., H1 → H3)
            - **Line length** - Keep lines under 120 characters (or use exceptions)
            - **Blank lines** - Add blank lines around headings and code blocks
            - **Trailing spaces** - Remove trailing whitespace
            - **List formatting** - Use consistent list markers and indentation

            ### How to Fix
            1. Review the workflow logs for specific line numbers
            2. Install markdownlint extension in your editor (VS Code, etc.)
            3. Run \`markdownlint '**/*.md'\` locally before pushing
            4. Refer to [markdownlint rules](https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md)

            ### Configuration
            This project uses \`.markdownlint.json\` for rule configuration. Some rules are relaxed for educational content readability.

            ---

            _This comment was automatically generated by the Markdown Lint workflow._`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  markdown-lint-summary:
    runs-on: ubuntu-latest
    needs: markdown-lint
    if: always()

    steps:
      - name: PR Success Comment
        if: needs.markdown-lint.result == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Markdown linting passed! Your documentation follows the project style guidelines.'
            });
